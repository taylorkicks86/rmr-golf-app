<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RMR Golf RSVP Confirmation Preview</title>
  </head>
  <body style="margin:0;background:#f3f5ef;font-family:Arial,Helvetica,sans-serif;color:#171717;">
    <main style="min-height:100vh;background:#f3f5ef;">
      <section style="background:#1d392f;border-bottom:4px solid #15d6ad;padding:22px 24px;">
        <div style="max-width:760px;margin:0 auto;">
          <img src="public/rmr-logo.png" width="92" alt="RMR Golf" style="display:block;width:92px;height:auto;border:0;" />
        </div>
      </section>

      <section style="background-image:linear-gradient(rgba(29,57,47,.58),rgba(29,57,47,.58)),url('public/images/backgrounds/rmr-course-bg.jpg');background-size:cover;background-position:center;padding:54px 20px 120px;">
        <div style="max-width:760px;margin:0 auto;">
          <div style="font-size:13px;line-height:18px;letter-spacing:4px;text-transform:uppercase;color:#bceada;font-weight:800;">
            RMR Golf League
          </div>
          <h1 style="margin:12px 0 0;font-size:44px;line-height:48px;color:#ffffff;font-weight:800;letter-spacing:0;">
            RSVP confirmed
          </h1>
          <p style="margin:12px 0 0;font-size:19px;line-height:28px;color:#edf7f1;font-weight:700;">
            Your attendance has been updated for this week.
          </p>
        </div>
      </section>

      <section style="max-width:760px;margin:-76px auto 0;padding:0 20px 48px;">
        <div style="border:1px solid #b9d9cc;background:#fffdf7;border-radius:8px;overflow:hidden;box-shadow:0 14px 38px rgba(29,57,47,.18);">
          <div style="background:#1d392f;color:#ffffff;padding:22px 24px;">
            <div style="display:inline-block;width:14px;height:14px;border-radius:999px;background:#15d6ad;margin-right:10px;vertical-align:middle;"></div>
            <span style="font-size:22px;line-height:28px;font-weight:800;vertical-align:middle;">You are marked as playing</span>
          </div>
          <div style="padding:28px 24px 30px;">
            <p style="margin:0 0 6px;font-size:14px;line-height:20px;letter-spacing:2px;text-transform:uppercase;color:#467866;font-weight:800;">
              This Week
            </p>
            <h2 style="margin:0 0 8px;font-size:28px;line-height:34px;color:#171717;font-weight:800;">
              Thursday, July 31 · Front 9
            </h2>
            <p style="margin:0 0 24px;font-size:17px;line-height:26px;color:#5f6470;">
              Thanks, Lateef. The tee sheet and attendance list now show you as playing this week.
            </p>
            <a href="/" style="display:inline-block;background:#0a9f6b;border-radius:6px;color:#ffffff;font-size:16px;line-height:20px;font-weight:800;text-align:center;text-decoration:none;padding:14px 18px;">
              Back to RMR Golf
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
